name: desktop-rs

on:
  push:
    branches: [main]
    paths:
      - "desktop-rs/**"
      - "desktop/favicon.ico"
      - "desktop/lrcplayer.py"
      - ".github/workflows/desktop-rs.yml"
  pull_request:
    paths:
      - "desktop-rs/**"
      - "desktop/favicon.ico"
      - "desktop/lrcplayer.py"
      - ".github/workflows/desktop-rs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-rs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: desktop-rs

jobs:
  fixtures:
    name: Test songs and expected results from the Python app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop-rs/tools/requirements.txt
      - name: Install ffmpeg and the libraries Qt loads
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3 libpulse0
      - run: pip install -r tools/requirements.txt
      - name: Check that tests/fixtures/pure.json matches the Python app
        run: python tools/make_fixtures.py pure --check
      - name: Check that the romaji samples match the Python app's cutlet
        run: python tools/make_fixtures.py romaji crates/lrc-romaji/tests/fixtures/lrc crates/lrc-romaji/tests/fixtures/romaji.json --check
      - name: Make tagged songs in all six formats
        run: python tools/make_fixtures.py media "$RUNNER_TEMP/media"
      - uses: actions/upload-artifact@v4
        with:
          name: media-fixtures
          path: ${{ runner.temp }}/media
          if-no-files-found: error

  checks:
    name: Format, lint and core tests (Linux)
    needs: fixtures
    runs-on: ubuntu-latest
    env:
      LRC_REQUIRE_MEDIA_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v5
      # The runner context isn't available in a job's env, so the paths are set here.
      - name: Point the tests at the test songs
        run: |
          echo "LRC_MEDIA_FIXTURES=$RUNNER_TEMP/media" >> "$GITHUB_ENV"
          echo "LRC_EMBED_OUT=$RUNNER_TEMP/media/embedded" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs
      - uses: actions/download-artifact@v4
        with:
          name: media-fixtures
          path: ${{ runner.temp }}/media
      - name: Install the libraries Slint, cpal (ALSA) and Qt link against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev libasound2-dev libegl1 libgl1 libxkbcommon0 libglib2.0-0 libdbus-1-3 libpulse0
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p lrc-core --locked
      # Decoding and seeking in every format, resampling and the output clock (no sound device needed).
      - run: cargo test -p lrc-player --locked
      # Romaji with each dictionary. Lindera downloads it while building.
      - run: cargo test -p lrc-romaji --locked
      - run: cargo test -p lrc-romaji --locked --no-default-features --features ipadic
      - name: Compare the romaji with cutlet's, for both dictionaries
        run: |
          for dict in unidic ipadic; do
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            cargo run -q -p lrc-romaji --release --locked --no-default-features --features "$dict" \
              --example compare -- crates/lrc-romaji/tests/fixtures/romaji.json | tee -a "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: desktop-rs/tools/requirements.txt
      - run: pip install -r tools/requirements.txt
      - name: Check that mutagen reads back the lyrics lrc-core embedded
        run: python tools/make_fixtures.py check-embedded "$LRC_MEDIA_FIXTURES"

  windows:
    name: Build LRCOpenPlayer.exe (Windows)
    needs: fixtures
    runs-on: windows-latest
    env:
      LRC_REQUIRE_MEDIA_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v5
      - name: Point the tests at the test songs
        shell: bash
        run: echo "LRC_MEDIA_FIXTURES=$RUNNER_TEMP/media" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs
      - uses: actions/download-artifact@v4
        with:
          name: media-fixtures
          path: ${{ runner.temp }}/media
      # The Windows-only code (behind cfg(windows)) is only linted here.
      - run: cargo clippy -p lrc-player --locked -- -D warnings
      - run: cargo test -p lrc-core --locked
      - run: cargo test -p lrc-player --locked
      - run: cargo build -p lrc-player --release --locked
      - name: Record the size of the exe
        shell: bash
        run: |
          bytes=$(stat -c %s target/release/LRCOpenPlayer.exe)
          echo "LRCOpenPlayer.exe: $bytes bytes ($((bytes / 1048576)) MB)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: LRCOpenPlayer
          path: desktop-rs/target/release/LRCOpenPlayer.exe
          if-no-files-found: error

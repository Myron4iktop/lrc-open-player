name: desktop-rs

on:
  push:
    branches: [main]
    paths:
      - "desktop-rs/**"
      - "desktop/favicon.ico"
      - ".github/workflows/desktop-rs.yml"
  pull_request:
    paths:
      - "desktop-rs/**"
      - "desktop/favicon.ico"
      - ".github/workflows/desktop-rs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-rs-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    working-directory: desktop-rs

jobs:
  checks:
    name: Format, lint and core tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs
      - name: Install the libraries Slint links against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libfontconfig1-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test -p lrc-core --locked

  windows:
    name: Build LRCOpenPlayer.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop-rs
      # The Windows-only code (behind cfg(windows)) is only linted here.
      - run: cargo clippy -p lrc-player --locked -- -D warnings
      - run: cargo test -p lrc-core --locked
      - run: cargo build -p lrc-player --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: LRCOpenPlayer
          path: desktop-rs/target/release/LRCOpenPlayer.exe
          if-no-files-found: error

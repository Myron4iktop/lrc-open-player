# Used by the release workflow: `cargo about generate` writes THIRD_PARTY_LICENSES.html,
# the full license text of every crate built into LRCOpenPlayer.exe, shipped next to it.
targets = ["x86_64-pc-windows-msvc"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "GPL-3.0-only",
    "GPL-3.0",
    "MPL-2.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "0BSD",
    "CC0-1.0",
    "OpenSSL",
    "LGPL-2.1",
    "MIT-0",
]

[package]
name = "lrc-player"
description = "LRC Open Player, a Windows music player built around synced lyrics."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "LRCOpenPlayer"
path = "src/main.rs"

[dependencies]
lrc-core.workspace = true
slint.workspace = true
# Lets Slint decode `desktop/favicon.ico` for the window icon (it reads PNG and JPEG only by default).
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
# Decoding: FLAC, MP3, AAC and ALAC in M4A, Vorbis and Opus in OGG, and WAV. The metadata
# readers only let the probe step over ID3 and APE tags; tags themselves come from lrc-core.
symphonia = { version = "0.6", default-features = false, features = ["aac", "alac", "all-meta", "flac", "isomp4", "mp3", "ogg", "pcm", "vorbis", "wav", "opt-simd"] }
# Symphonia has no Opus decoder of its own. `bundled` (the default) builds libopus from C.
symphonia-adapter-libopus = "0.3"
cpal = "0.18"
rubato = "5"
# The lock-free buffer between the decode thread and the output callback.
rtrb = "0.4"
rfd = "0.17"
serde_json = "1"
# Draws the visualizer (Slint already builds it, for SVG icons).
tiny-skia = { version = "0.12", default-features = false, features = ["std", "simd"] }

# The same winit that Slint uses, for dropped files, the window handle and the taskbar
# icon. Keep its minor version in step with Slint's.
winit = { version = "0.30", default-features = false, features = ["rwh_06"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Foundation",
    "Media",
    "Media_Playback",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
slint-build.workspace = true

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[package]
name = "lrc-core"
description = "Lyrics, tags, library and online lookups for LRC Open Player. No UI and no Windows APIs."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
caseless = "0.2"
encoding_rs = "0.8"
fastrand = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif", "bmp", "webp"] }
lofty = "0.25"
regex = "1"
# The visualizer's FFT (already built for Rubato's resampler).
rustfft = "6.4"
serde_json = "1"
tempfile = "3"
# No gzip: the Python app's urllib does not ask for it either. The platform verifier
# trusts the certificates Windows trusts, as Python does on Windows.
ureq = { version = "3.5", default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
base64 = "0.22"
